name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: bash -n scripts/install-ubuntu.sh scripts/build-pjsip.sh scripts/find-hermes.sh
      - run: shellcheck scripts/install-ubuntu.sh scripts/build-pjsip.sh scripts/find-hermes.sh
      - run: python -m pip wheel --no-deps . --wheel-dir dist
  native-sip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential swig pkg-config libssl-dev libsrtp2-dev libasound2-dev
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install 'setuptools>=75,<83' 'wheel>=0.45,<1'
      - run: bash scripts/build-pjsip.sh "$PWD/.venv" "$RUNNER_TEMP/hermes-pjsip"
      - run: .venv/bin/python -m pip install '.[dev]'
      - run: .venv/bin/python -m pytest -q tests/test_native.py
